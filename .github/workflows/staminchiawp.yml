name: Esegui Staminchia Manualmente

# Avvio solo manuale
on:
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:

    # 1. Scarica il repository
    - name: Checkout del repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    # 2. Configura Python
    - name: Configura Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    # 3. Installa le librerie
    - name: Installa le dipendenze
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    # 4. Esegue lo script
    - name: Esegui lo script staminchiawp.py
      run: python staminchiawp.py

    # 5. Controlla che il file M3U sia stato creato
    - name: Controlla file M3U
      run: |
        echo "Contenuto della cartella:"
        ls -lah

        echo ""
        echo "Controllo staminchiawp.m3u:"

        if [ -f "staminchiawp.m3u" ]; then
          echo "OK - staminchiawp.m3u trovato"
          ls -lh staminchiawp.m3u
        else
          echo "ERRORE - staminchiawp.m3u NON trovato"
          exit 1
        fi

    # 6. Salva e pusha i file aggiornati su GitHub
    - name: Salva e pusha i file aggiornati
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"

        git add eventi.json index.html staminchiawp.m3u

        # Verifica se ci sono modifiche
        if ! git diff --cached --quiet; then
          git commit -m "Aggiornamento palinsesto (Avvio Manuale)"
          git push
        else
          echo "Nessuna modifica rilevata nei file."
        fi
