name: Avvio Manuale Scraping Live

# Questo comando abilita il pulsante "Run workflow" per farlo partire solo quando vuoi tu manuale
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    # 1. Copia i file del tuo progetto sul server virtuale
    - name: Checkout del codice
      uses: actions/checkout@v4

    # 2. Configura l'ambiente Python sul server
    - name: Configura Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Installa le librerie che usi nel tuo script (requests e beautifulsoup4)
    - name: Installa le librerie richieste
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    # 4. Esegue il tuo nuovo file Python che genera il JSON
    - name: Esegui lo script provaapp.py
      run: python provaapp.py

    # 5. Salva i file aggiornati su GitHub
    - name: Salva i file aggiornati su GitHub
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add dati_streaming.json can.json can.m3u
        if git diff --cached --quiet; then
          echo "Nessuna modifica rilevata"
        else
          git commit -m "Aggiornati file VAVOO"
          git push
        fi
