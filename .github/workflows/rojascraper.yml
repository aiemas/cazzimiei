name: Aggiornamento Automatico Palinsesto M3U

on:
  schedule:
    # Esegue lo script ogni 60 minuti
    - cron: '*/60 * * * *'
  workflow_dispatch: # Permette l'avvio manuale

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    # --- FORZA IL FUSO ORARIO ITALIANO SUL SERVER DI GITHUB ---
    env:
      TZ: Europe/Rome

    steps:
    # 1. Copia i file del tuo repository sul server di GitHub
    - name: Checkout del codice
      uses: actions/checkout@v4

    # 2. Configura l'ambiente Python
    - name: Configura Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Installa Google Chrome nel sistema virtuale di GitHub
    - name: Installa Chrome
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: stable

    # 4. Installa le librerie Python necessarie
    - name: Installa le dipendenze
      run: |
        python -m pip install --upgrade pip
        pip install selenium beautifulsoup4

    # 5. Esegue il tuo script Python
    - name: Esegui lo Scraper
      run: python roja.py

    # 6. Salva e pubblica il file .m3u generato nel tuo repository GitHub
    - name: Salva e pusha il file M3U aggiornato
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        touch palinsesto.m3u
        git add palinsesto.m3u
        git diff --quiet && git diff --staged --quiet || (git commit -m "Palinsesto aggiornato automaticamente" && git push)
