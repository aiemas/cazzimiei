name: Esegui Staminchia Manualmente

# Configura il trigger solo per l'avvio manuale
on:
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
    # 1. Scarica il codice del tuo repository
    - name: Checkout del repository
      uses: actions/checkout@v4

    # 2. Configura Python sul server di GitHub
    - name: Configura Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    # 3. Installa le librerie necessarie (BeautifulSoup4 e Requests)
    - name: Installa le dipendenze
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    # 4. Esegue lo script che genera JSON e HTML
    - name: Esegui lo script staminchia.py
      run: python staminchia.py

    # 5. Salva i file generati e fa il push automatico su GitHub
    - name: Salva e pusha i file aggiornati
      run: |
        git config --local user.email "github-actions[bot]@://github.com"
        git config --local user.name "github-actions[bot]"
        git add eventi.json index.html
        
        # Verifica se ci sono modifiche prima di fare il commit per evitare errori
        if ! git diff --cached --quiet; then
          git commit -m "Aggiornamento palinsesto (Avvio Manuale)"
          git push
        else
          echo "Nessuna modifica rilevata nei file."
        fi
