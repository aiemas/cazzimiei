name: Esegui Staminchia2 Manualmente

on:
  workflow_dispatch:

jobs:
  run-scraper:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. SCARICA IL REPOSITORY
      # =====================================================

      - name: Checkout del repository
        uses: actions/checkout@v4


      # =====================================================
      # 2. CONFIGURA PYTHON
      # =====================================================

      - name: Configura Python
        uses: actions/setup-python@v5

        with:
          python-version: '3.x'


      # =====================================================
      # 3. INSTALLA LE LIBRERIE
      # =====================================================

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4


      # =====================================================
      # 4. ESEGUE LO SCRIPT PYTHON
      # =====================================================

      - name: Esegui staminchia2.py
        run: |
          python staminchia2.py


      # =====================================================
      # 5. CONTROLLA CHE INDEX.HTML SIA STATO CREATO
      # =====================================================

      - name: Controlla index.html
        run: |
          echo "Contenuto della cartella:"
          ls -la

          echo ""
          echo "Controllo index.html..."

          if [ ! -f index.html ]; then
            echo "ERRORE: index.html NON è stato creato!"
            exit 1
          fi

          echo "OK: index.html esiste."

          echo ""
          echo "Dimensione index.html:"
          wc -c index.html


      # =====================================================
      # 6. COMMIT E PUSH SU GITHUB
      # =====================================================

      - name: Commit e push index.html
        run: |

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          echo "Aggiungo index.html..."

          git add index.html

          echo ""
          echo "Controllo modifiche..."

          if git diff --cached --quiet; then

            echo "Nessuna modifica rilevata."

          else

            echo "Modifiche rilevate."

            git commit -m "Aggiornamento automatico palinsesto"

            git push

            echo ""
            echo "======================================"
            echo "PUSH COMPLETATO"
            echo "======================================"

          fi
