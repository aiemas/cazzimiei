<title>TV Player</title>


<style>

/* =========================================================
   BASE
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #000;

    color: white;

    font-family: Arial, sans-serif;

    overflow: hidden;

}


/* =========================================================
   PLAYER
   ========================================================= */

#playerContainer {

    position: fixed;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    background: #000;

    z-index: 1;

}


#player {

    width: 100%;
    height: 100%;

    border: 0;

    background: #000;

}


/* =========================================================
   SIDEBAR
   ========================================================= */

#sidebar {

    position: fixed;

    left: 0;
    top: 0;

    width: 300px;
    height: 100vh;

    background: rgba(15, 23, 42, 0.97);

    padding: 15px;

    overflow-y: auto;

    z-index: 1000;

    transform: translateX(0);

    transition: transform 0.35s ease;

    box-shadow: 5px 0 20px rgba(0,0,0,0.5);

}


/* Sidebar nascosta */

#sidebar.hidden {

    transform: translateX(-100%);

}


/* =========================================================
   TITOLO
   ========================================================= */

#sidebar h1 {

    margin: 5px 0 20px 0;

    text-align: center;

    font-size: 22px;

}

#searchBox {

    width: 100%;

    padding: 12px;

    margin-bottom: 15px;

    background: #1f2937;

    border: 2px solid #374151;

    border-radius: 8px;

    color: white;

    font-size: 16px;

    outline: none;

}

#searchBox:focus {

    border-color: white;

    background: #374151;

}

#searchBox::placeholder {

    color: #9ca3af;

}


/* =========================================================
   EVENTO
   ========================================================= */

.event {

    margin-bottom: 12px;

}


.eventTitle {

    width: 100%;

    display: block;

    padding: 12px 10px;

    margin-bottom: 6px;

    background: #111827;

    border: 2px solid transparent;

    border-radius: 8px;

    color: white;

    font-size: 15px;

    font-weight: bold;

    line-height: 1.3;

    cursor: pointer;

    text-align: left;

}


.eventTitle:hover {

    background: #1f2937;

}


.eventTitle:focus {

    outline: none;

    border-color: white;

    background: #16a34a;

}


.eventTime {

    color: #22c55e;

    margin-right: 6px;

}


/* =========================================================
   CONTENITORE CANALI
   ========================================================= */

.eventChannels {

    display: block;

    padding-left: 8px;

}


.eventChannels.hidden {

    display: none;

}


/* =========================================================
   CANALI
   ========================================================= */

.channel {

    width: 100%;

    display: block;

    margin-bottom: 7px;

    padding: 12px 10px;

    background: #1f2937;

    border: 2px solid transparent;

    border-radius: 8px;

    color: white;

    font-size: 15px;

    cursor: pointer;

    text-align: left;

}


.channel:hover {

    background: #374151;

}


.channel:focus {

    outline: none;

    border-color: white;

    background: #16a34a;

}


.channel.active {

    background: #16a34a;

    border-color: white;

}


/* =========================================================
   MESSAGGIO
   ========================================================= */

.message {

    text-align: center;

    color: #9ca3af;

    padding: 20px;

    font-size: 14px;

}


/* =========================================================
   NOME CANALE
   ========================================================= */

#topBar {

    position: fixed;

    top: 15px;
    left: 320px;

    z-index: 900;

    background: rgba(0,0,0,0.65);

    padding: 8px 15px;

    border-radius: 6px;

    font-size: 18px;

    font-weight: bold;

    transition: opacity 0.3s ease;

}


#topBar.hidden {

    opacity: 0;

}


/* =========================================================
   ZONA INVISIBILE PER RIAPRIRE IL MENU
   ========================================================= */

#leftTrigger {

    position: fixed;

    left: 0;
    top: 0;

    width: 25px;
    height: 100vh;

    z-index: 800;

}


/* =========================================================
   BOTTONE CHIUDI
   ========================================================= */

#closeMenu {

    position: absolute;

    top: 10px;
    right: 10px;

    background: #374151;

    border: none;

    color: white;

    width: 35px;
    height: 35px;

    border-radius: 50%;

    cursor: pointer;

    font-size: 18px;

}


/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (max-width: 700px) {

    #sidebar {

        width: 240px;

    }

    #topBar {

        left: 260px;

    }

}

</style>

</head>

/* =========================================================
   CANALI
   ========================================================= */

const channels = [];

const eventButtons = [];


/* =========================================================
   ELEMENTI
   ========================================================= */

const channelList =
    document.getElementById("channelList");
const searchBox =
    document.getElementById("searchBox");


const player =
    document.getElementById("player");


const currentChannel =
    document.getElementById("currentChannel");


const sidebar =
    document.getElementById("sidebar");


const topBar =
    document.getElementById("topBar");


/* =========================================================
   CREA LISTA EVENTI E CANALI
   ========================================================= */

let globalIndex = 0;


events.forEach(function(event) {


    /* =====================================================
       CONTENITORE EVENTO
       ===================================================== */

    const eventContainer =
        document.createElement("div");


    eventContainer.className =
        "event";


    /* =====================================================
       TITOLO EVENTO
       ===================================================== */

    const eventTitle =
        document.createElement("button");


    eventTitle.type =
        "button";


    eventTitle.className =
        "eventTitle";


    eventTitle.innerHTML =
        '<span class="eventArrow">▶</span>' +
        '<span class="eventTime">' +
        escapeHtml(event.time) +
        '</span>' +
        escapeHtml(event.title);


    eventTitle.setAttribute(
        "tabindex",
        eventButtons.length + 1
    );


    /* =====================================================
       CONTENITORE CANALI
       ===================================================== */

    const eventChannels =
        document.createElement("div");


    eventChannels.className =
        "eventChannels hidden";


    eventTitle.onclick =
        function() {

            toggleEvent(
                eventContainer,
                eventTitle,
                eventChannels
            );

        };


    eventContainer.appendChild(
        eventTitle
    );


    eventContainer.appendChild(
        eventChannels
    );


    eventButtons.push(
        eventTitle
    );


    /* =====================================================
       CANALI
       ===================================================== */

    event.channels.forEach(
        function(channel) {


            /* =============================================
               SALVA CANALE
               ============================================= */

            const channelIndex =
                globalIndex;


            channels.push({

                name: channel.name,

                id: channel.id,

                url: channel.url,

                eventTitle: event.title,

                eventTime: event.time

            });


            /* =============================================
               CREA PULSANTE
               ============================================= */

            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "channel";


            button.textContent =
                "▶ " + channel.name;


            button.setAttribute(
                "tabindex",
                channelIndex + 1000
            );


            button.onclick =
                function() {

                    playChannel(
                        channelIndex
                    );

                };


            eventChannels.appendChild(
                button
            );


            globalIndex++;

        }
    );


    /* =====================================================
       AGGIUNGE EVENTO ALLA SIDEBAR
       ===================================================== */

    channelList.appendChild(
        eventContainer
    );

});

/* =========================================================
   APRI / CHIUDI EVENTO
   ========================================================= */

function toggleEvent(
    eventContainer,
    eventTitle,
    eventChannels
) {

    const isOpen =
        !eventChannels.classList.contains(
            "hidden"
        );


    /* Chiude tutti gli altri eventi */

    document
        .querySelectorAll(".eventChannels")
        .forEach(function(container) {

            container.classList.add("hidden");

        });


    document
        .querySelectorAll(".eventTitle")
        .forEach(function(button) {

            const arrow =
                button.querySelector(".eventArrow");

            if (arrow) {
                arrow.textContent = "▶";
            }

        });


    if (!isOpen) {

        eventChannels.classList.remove(
            "hidden"
        );

        const arrow =
            eventTitle.querySelector(
                ".eventArrow"
            );

        if (arrow) {
            arrow.textContent = "▼";
        }

        const firstChannel =
            eventChannels.querySelector(
                ".channel"
            );

        if (firstChannel) {
            setTimeout(function() {
                firstChannel.focus();
            }, 50);
        }

    }

    showSidebar();

}


searchBox.addEventListener(
    "input",
    function() {

        const search =
            searchBox.value
                .toLowerCase()
                .trim();

        const eventsContainers =
            document.querySelectorAll(".event");

        eventsContainers.forEach(
            function(container) {

                const text =
                    container.textContent
                        .toLowerCase();

                if (
                    text.includes(search)
                ) {

                    container.style.display =
                        "";

                }
                else {

                    container.style.display =
                        "none";

                }

            }
        );

    }
);


/* =========================================================
   TIMER
   ========================================================= */

let hideTimer;


/* =========================================================
   INDICE CORRENTE
   ========================================================= */

let currentIndex = 0;


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(text) {

    const div =
        document.createElement("div");


    div.textContent =
        text;


    return div.innerHTML;

}


/* =========================================================
   RIPRODUCI CANALE
   ========================================================= */

function playChannel(index) {


    if (
        index < 0 ||
        index >= channels.length
    ) {

        return;

    }


    currentIndex =
        index;


    /* =====================================================
       CAMBIA STREAM
       ===================================================== */

    player.src =
        channels[index].url;


    /* =====================================================
       CAMBIA NOME
       ===================================================== */

    currentChannel.textContent =
        channels[index].name;


    /* =====================================================
       AGGIORNA SELEZIONE
       ===================================================== */

    const buttons =
        document.querySelectorAll(
            ".channel"
        );


    buttons.forEach(
        function(button) {

            button.classList.remove(
                "active"
            );

        }
    );


    if (buttons[index]) {

        buttons[index].classList.add(
            "active"
        );

    }


    /* =====================================================
       SCROLL
       ===================================================== */

    if (buttons[index]) {

        buttons[index].scrollIntoView({

            behavior: "smooth",

            block: "center"

        });

    }


    /* =====================================================
       MOSTRA SIDEBAR
       ===================================================== */

    showSidebar();

}


/* =========================================================
   MOSTRA SIDEBAR
   ========================================================= */

function showSidebar() {


    sidebar.classList.remove(
        "hidden"
    );


    topBar.classList.remove(
        "hidden"
    );


    resetHideTimer();

}


/* =========================================================
   NASCONDE SIDEBAR
   ========================================================= */

function hideSidebar() {


    clearTimeout(
        hideTimer
    );


    sidebar.classList.add(
        "hidden"
    );


    topBar.classList.add(
        "hidden"
    );

}


/* =========================================================
   RESET TIMER
   ========================================================= */

function resetHideTimer() {


    clearTimeout(
        hideTimer
    );


    hideTimer =
        setTimeout(
            function() {

                hideSidebar();

            },
            3000
        );

}


/* =========================================================
   MOUSE SULLA SIDEBAR
   ========================================================= */

sidebar.addEventListener(
    "mousemove",
    function() {

        if (
            !sidebar.classList.contains(
                "hidden"
            )
        ) {

            resetHideTimer();

        }

    }
);


/* =========================================================
   SCROLL
   ========================================================= */

sidebar.addEventListener(
    "wheel",
    function() {

        showSidebar();

    }
);


/* =========================================================
   TOUCH
   ========================================================= */

sidebar.addEventListener(
    "touchstart",
    function() {

        showSidebar();

    }
);


sidebar.addEventListener(
    "touchmove",
    function() {

        showSidebar();

    }
);


/* =========================================================
   ZONA SINISTRA
   ========================================================= */

document
    .getElementById("leftTrigger")
    .addEventListener(
        "mouseenter",
        function() {

            showSidebar();

        }
    );


document
    .getElementById("leftTrigger")
    .addEventListener(
        "mousemove",
        function() {

            showSidebar();

        }
    );


/* =========================================================
   TELECOMANDO / TASTIERA
   ========================================================= */

document.addEventListener(
    "keydown",
    function(event) {


        /* Se stiamo scrivendo nella ricerca,
           lasciamo gestire i tasti al campo */

        if (document.activeElement === searchBox) {

            if (event.key === "ArrowDown") {

                event.preventDefault();

                const visibleEvents =
                    eventButtons.filter(function(button) {
                        return button.closest(".event").style.display !== "none";
                    });

                if (visibleEvents.length > 0) {
                    visibleEvents[0].focus();
                }

            }

            return;

        }


        const eventButton =
            document.activeElement &&
            document.activeElement.classList.contains(
                "eventTitle"
            )
                ? document.activeElement
                : null;


        const channelButton =
            document.activeElement &&
            document.activeElement.classList.contains(
                "channel"
            )
                ? document.activeElement
                : null;


        /* =================================================
           SELEZIONE EVENTO
           ================================================= */

        if (eventButton) {

            const visibleEvents =
                eventButtons.filter(function(button) {
                    return button.closest(".event").style.display !== "none";
                });

            const eventIndex =
                visibleEvents.indexOf(eventButton);


            if (
                event.key === "ArrowDown"
            ) {

                event.preventDefault();

                if (visibleEvents.length > 0) {

                    const next =
                        eventIndex < visibleEvents.length - 1
                            ? eventIndex + 1
                            : 0;

                    visibleEvents[next].focus();

                }

                return;

            }


            if (
                event.key === "ArrowUp"
            ) {

                event.preventDefault();

                if (visibleEvents.length > 0) {

                    const previous =
                        eventIndex > 0
                            ? eventIndex - 1
                            : visibleEvents.length - 1;

                    visibleEvents[previous].focus();

                }

                return;

            }


            if (
                event.key === "Enter" ||
                event.key === " " ||
                event.key === "ArrowRight"
            ) {

                event.preventDefault();

                eventButton.click();

                return;

            }


            if (
                event.key === "ArrowLeft"
            ) {

                event.preventDefault();
                hideSidebar();
                return;

            }

        }


        /* =================================================
           SELEZIONE CANALE
           ================================================= */

        if (channelButton) {

            const parentChannels =
                channelButton.closest(
                    ".eventChannels"
                );

            const channelButtons =
                Array.from(
                    parentChannels.querySelectorAll(
                        ".channel"
                    )
                );

            const channelIndex =
                channelButtons.indexOf(
                    channelButton
                );


            if (
                event.key === "ArrowDown"
            ) {

                event.preventDefault();

                if (channelButtons.length > 0) {

                    const next =
                        channelIndex < channelButtons.length - 1
                            ? channelIndex + 1
                            : 0;

                    channelButtons[next].focus();

                }

                return;

            }


            if (
                event.key === "ArrowUp"
            ) {

                event.preventDefault();

                if (channelButtons.length > 0) {

                    const previous =
                        channelIndex > 0
                            ? channelIndex - 1
                            : channelButtons.length - 1;

                    channelButtons[previous].focus();

                }

                return;

            }


            if (
                event.key === "ArrowLeft"
            ) {

                event.preventDefault();

                const parentEvent =
                    channelButton.closest(".event");

                const parentTitle =
                    parentEvent.querySelector(
                        ".eventTitle"
                    );

                if (parentTitle) {
                    parentTitle.focus();
                }

                return;

            }


            if (
                event.key === "ArrowRight"
            ) {

                event.preventDefault();
                hideSidebar();
                return;

            }


            if (
                event.key === "Enter" ||
                event.key === " "
            ) {

                event.preventDefault();

                channelButton.click();

                return;

            }

        }


        /* =================================================
           ATTIVITÀ GENERALE
           ================================================= */

        if (
            event.key === "ArrowLeft" ||
            event.key === "ArrowRight" ||
            event.key === "ArrowUp" ||
            event.key === "ArrowDown" ||
            event.key === "Enter" ||
            event.key === " "
        ) {

            showSidebar();

        }

    }
);


/* =========================================================
   AVVIO
   ========================================================= */

window.addEventListener(
    "load",
    function() {


        console.log(
            "Eventi caricati:",
            events.length
        );


        console.log(
            "Canali caricati:",
            channels.length
        );


        /* =================================================
           METTE IL PRIMO EVENTO A FUOCO
           ================================================= */

        if (eventButtons.length > 0) {

            eventButtons[0].focus();

            eventButtons[0].scrollIntoView({

                behavior: "instant",

                block: "center"

            });

        }


        /* =================================================
           TIMER SIDEBAR
           ================================================= */

        resetHideTimer();

    }
);


</script>
