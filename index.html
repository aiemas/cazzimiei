<style>

/* =========================================================
   BASE
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #000;

    color: white;

    font-family: Arial, sans-serif;

    overflow: hidden;

}



/* =========================================================
   PLAYER
   ========================================================= */

#playerContainer {

    position: fixed;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    background: #000;

    z-index: 1;

}



#player {

    width: 100%;
    height: 100%;

    border: 0;

    background: #000;

}



/* =========================================================
   SIDEBAR
   ========================================================= */

#sidebar {

    position: fixed;

    left: 0;
    top: 0;

    width: 380px;
    height: 100vh;

    background: rgba(15, 23, 42, 0.40);

    padding: 15px;

    overflow-y: auto;

    z-index: 1000;

    transform: translateX(0);

    transition: transform 0.35s ease;

    box-shadow: 5px 0 20px rgba(0,0,0,0.5);

}


/* =========================================================
   SIDEBAR NASCOSTA
   ========================================================= */

#sidebar.hidden {

    transform: translateX(-100%);

}



/* =========================================================
   TITOLO
   ========================================================= */

#sidebar h1 {

    margin: 5px 0 15px 0;

    text-align: center;

    font-size: 22px;

}



/* =========================================================
   NAVIGAZIONE EVENTI / CANALI
   ========================================================= */

#menuTabs {

    display: flex;

    width: 100%;

    gap: 6px;

    margin-bottom: 12px;

}



.menuTab {

    flex: 1;

    padding: 11px 8px;

    background: #1f2937;

    border: 2px solid transparent;

    border-radius: 8px;

    color: white;

    font-size: 14px;

    font-weight: bold;

    cursor: pointer;

}



.menuTab:hover {

    background: #374151;

}



.menuTab:focus {

    outline: none;

    border-color: white;

}



.menuTab.active {

    background: #16a34a;

    border-color: white;

}



/* =========================================================
   RICERCA
   ========================================================= */

#searchBox {

    width: 100%;

    padding: 12px;

    margin-bottom: 15px;

    background: #1f2937;

    border: 2px solid #374151;

    border-radius: 8px;

    color: white;

    font-size: 16px;

    outline: none;

}



#searchBox:focus {

    border-color: white;

    background: #374151;

}



#searchBox::placeholder {

    color: #9ca3af;

}



/* =========================================================
   EVENTO
   ========================================================= */

.event {

    margin-bottom: 18px;

}



.eventTitle {

    padding: 10px;

    margin-bottom: 6px;

    background: #111827;

    border-radius: 6px;

    font-size: 15px;

    font-weight: bold;

    line-height: 1.3;

}



.eventTime {

    color: #22c55e;

    margin-right: 6px;

}



/* =========================================================
   CANALI EVENTI
   ========================================================= */

.channel {

    width: 100%;

    display: block;

    margin-bottom: 7px;

    padding: 12px 10px;

    background: #1f2937;

    border: 2px solid transparent;

    border-radius: 8px;

    color: white;

    font-size: 15px;

    cursor: pointer;

    text-align: left;

}



.channel:hover {

    background: #374151;

}



.channel:focus {

    outline: none;

    border-color: white;

    background: #16a34a;

}



.channel.active {

    background: #16a34a;

    border-color: white;

}



/* =========================================================
   CANALI 24/7
   ========================================================= */

.channel247 {

    width: 100%;

    display: block;

    margin-bottom: 7px;

    padding: 12px 10px;

    background: #1f2937;

    border: 2px solid transparent;

    border-radius: 8px;

    color: white;

    font-size: 15px;

    cursor: pointer;

    text-align: left;

}



.channel247:hover {

    background: #374151;

}



.channel247:focus {

    outline: none;

    border-color: white;

    background: #16a34a;

}



.channel247.active {

    background: #16a34a;

    border-color: white;

}



/* =========================================================
   CONTENITORI LISTE
   ========================================================= */

#eventList,
#channel247List {

    width: 100%;

}



.hiddenList {

    display: none;

}



/* =========================================================
   MESSAGGIO
   ========================================================= */

.message {

    text-align: center;

    color: #9ca3af;

    padding: 20px;

    font-size: 14px;

}



/* =========================================================
   NOME CANALE
   ========================================================= */

#topBar {

    position: fixed;

    top: 15px;
    left: 400px;

    z-index: 900;

    background: rgba(0,0,0,0.65);

    padding: 8px 15px;

    border-radius: 6px;

    font-size: 18px;

    font-weight: bold;

    transition: opacity 0.3s ease;

}



#topBar.hidden {

    opacity: 0;

}



/* =========================================================
   ZONA INVISIBILE PER RIAPRIRE IL MENU
   ========================================================= */

#leftTrigger {

    position: fixed;

    left: 0;
    top: 0;

    width: 25px;
    height: 100vh;

    z-index: 800;

}



/* =========================================================
   BOTTONE CHIUDI
   ========================================================= */

#closeMenu {

    position: absolute;

    top: 10px;
    right: 10px;

    background: #374151;

    border: none;

    color: white;

    width: 35px;
    height: 35px;

    border-radius: 50%;

    cursor: pointer;

    font-size: 18px;

}



/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (max-width: 700px) {

    #sidebar {

        width: 320px;

    }

    #topBar {

        left: 340px;

    }

}

</style>

         ===================================================== -->

    <!-- =====================================================

         ===================================================== -->

    <!-- =====================================================

         ===================================================== -->

</div>



<!-- =========================================================

<div id="topBar">

/* =========================================================
   CANALI EVENTI
   ========================================================= */

const channels = [];



/* =========================================================
   ELEMENTI
   ========================================================= */

const eventList =
    document.getElementById("eventList");

const channel247List =
    document.getElementById("channel247List");

const searchBox =
    document.getElementById("searchBox");

const player =
    document.getElementById("player");

const currentChannel =
    document.getElementById("currentChannel");

const sidebar =
    document.getElementById("sidebar");

const topBar =
    document.getElementById("topBar");

const sidebarTitle =
    document.getElementById("sidebarTitle");

const eventsTab =
    document.getElementById("eventsTab");

const channelsTab =
    document.getElementById("channelsTab");



/* =========================================================
   STATO
   ========================================================= */

let currentIndex = 0;

let currentMode = "events";



/* =========================================================
   CREA LISTA EVENTI
   ========================================================= */

let globalIndex = 0;



events.forEach(function(event) {



    const eventContainer =
        document.createElement("div");



    eventContainer.className =
        "event";



    /* =====================================================
       TITOLO EVENTO
       ===================================================== */

    const eventTitle =
        document.createElement("div");



    eventTitle.className =
        "eventTitle";



    eventTitle.innerHTML =
        '<span class="eventTime">' +
        escapeHtml(event.time) +
        '</span>' +
        escapeHtml(event.title);



    eventContainer.appendChild(
        eventTitle
    );



    /* =====================================================
       CANALI EVENTO
       ===================================================== */

    event.channels.forEach(
        function(channel) {



            const channelIndex =
                globalIndex;



            channels.push({

                name: channel.name,

                id: channel.id,

                url: channel.url,

                eventTitle: event.title,

                eventTime: event.time

            });



            const button =
                document.createElement(
                    "button"
                );



            button.className =
                "channel";



            button.textContent =
                "▶ " + channel.name;



            button.setAttribute(
                "tabindex",
                "0"
            );



            button.onclick =
                function() {

                    playEventChannel(
                        channelIndex
                    );

                };



            eventContainer.appendChild(
                button
            );



            globalIndex++;

        }
    );



    eventList.appendChild(
        eventContainer
    );

});

/* =========================================================

searchBox.addEventListener(
    "input",
    function() {

        const search =
            searchBox.value
                .toLowerCase()
                .trim();



        if (currentMode === "events") {

            const eventContainers =
                document.querySelectorAll(
                    "#eventList .event"
                );



            eventContainers.forEach(
                function(container) {

                    const text =
                        container.textContent
                            .toLowerCase();

                    if (
                        text.includes(search)
                    ) {

                        container.style.display =
                            "";

                    }
                    else {

                        container.style.display =
                            "none";

                    }

                }
            );

        }
        else {

            const buttons =
                document.querySelectorAll(
                    "#channel247List .channel247"
                );



            buttons.forEach(
                function(button) {

                    const text =
                        button.textContent
                            .toLowerCase();

                    if (
                        text.includes(search)
                    ) {

                        button.style.display =
                            "";

                    }
                    else {

                        button.style.display =
                            "none";

                    }

                }
            );

        }

    }
);



/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(text) {

    const div =
        document.createElement("div");



    div.textContent =
        text;



    return div.innerHTML;

}

   MOSTRA EVENTI
   ========================================================= */

        "📺 EVENTI";



    eventList.classList.remove(
        "hiddenList"
    );



    channel247List.classList.add(
        "hiddenList"
    );



    eventsTab.classList.add(

    );

}

        buttons[0].focus();

        buttons[0].scrollIntoView({

            behavior: "instant",

            block: "center"

        });

    }

}



/* =========================================================
   RIPRODUCI CANALE EVENTO
   ========================================================= */

function playEventChannel(index) {

    if (
        index < 0 ||
        index >= channels.length
    ) {

        return;

    }



    currentIndex =
        index;



    player.src =
        channels[index].url;



    currentChannel.textContent =
        channels[index].name;



    const buttons =
        document.querySelectorAll(
            "#eventList .channel"
        );



    buttons.forEach(
        function(button) {

            button.classList.remove(
                "active"
            );

        }
    );



    if (buttons[index]) {

        buttons[index].classList.add(
            "active"
        );

    }



    if (buttons[index]) {

        buttons[index].scrollIntoView({

            behavior: "smooth",

            block: "center"

        });

    }



    hideSidebar();

}

   RIPRODUCI CANALE 24/7
   ========================================================= */

function play247Channel(index) {

    if (
        index < 0 ||
        index >= channels247.length
    ) {

    player.src =

}

}

   ========================================================= */

    .getElementById("leftTrigger")

        "mousemove",

/* =========================================================
   TELECOMANDO / TASTIERA
   ========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        /* =================================================
           SIDEBAR NASCOSTA

           QUALSIASI TASTO RIAPRE IL MENU
           ================================================= */

        if (
            sidebar.classList.contains(
                "hidden"
            )
        ) {

            showSidebar();



            if (
                currentMode === "events"
            ) {

                const buttons =
                    Array.from(
                        document.querySelectorAll(
                            "#eventList .channel"
                        )
                    );



                if (
                    buttons[currentIndex]
                ) {

                    buttons[currentIndex].focus();

                    buttons[currentIndex].scrollIntoView({

                        behavior: "instant",

                        block: "center"

                    });

                }

            }
            else {

                const buttons =
                    Array.from(
                        document.querySelectorAll(
                            "#channel247List .channel247"
                        )
                    );



                if (buttons.length > 0) {

                    buttons[0].focus();

                    buttons[0].scrollIntoView({

                        behavior: "instant",

                        block: "center"

                    });

                }

            }



            return;

        }



        /* =================================================
           TAB ATTIVI
           ================================================= */

        if (
            document.activeElement === eventsTab ||
            document.activeElement === channelsTab
        ) {

            if (
                event.key === "ArrowLeft"
            ) {

                event.preventDefault();

                eventsTab.focus();

                return;

            }



            if (
                event.key === "ArrowRight"
            ) {

                event.preventDefault();

                channelsTab.focus();

                return;

            }



            if (
                event.key === "ArrowDown"
            ) {

                event.preventDefault();

                if (
                    currentMode === "events"
                ) {

                    const buttons =
                        document.querySelectorAll(
                            "#eventList .channel"
                        );

                    if (buttons.length > 0) {

                        buttons[0].focus();

                    }

                }
                else {

                    const buttons =
                        document.querySelectorAll(
                            "#channel247List .channel247"
                        );

                    if (buttons.length > 0) {

                        buttons[0].focus();

                    }

                }

                return;

            }

        }



        /* =================================================
           CANALE ATTIVO
           ================================================= */

        let buttons;



        if (
            currentMode === "events"
        ) {

            buttons =
                Array.from(
                    document.querySelectorAll(
                        "#eventList .channel"
                    )
                );

        }
        else {

            buttons =
                Array.from(
                    document.querySelectorAll(
                        "#channel247List .channel247"
                    )
                );

        }



        if (
            buttons.length === 0
        ) {

            return;

        }



        const current =
            document.activeElement;



        const index =
            buttons.indexOf(
                current
            );



        /* =================================================
           SINISTRA
           ================================================= */

        if (
            event.key === "ArrowLeft"
        ) {

            event.preventDefault();

            hideSidebar();

            return;

        }



        /* =================================================
           DESTRA
           ================================================= */

        if (
            event.key === "ArrowRight"
        ) {

            event.preventDefault();

            hideSidebar();

            return;

        }



        /* =================================================
           SU
           ================================================= */

        if (
            event.key === "ArrowUp"
        ) {

            event.preventDefault();



            let previous;



            if (index < 0) {

                previous =
                    buttons.length - 1;

            }
            else {

                previous =
                    index - 1;

            }



            if (
                previous < 0
            ) {

                previous =
                    buttons.length - 1;

            }



            buttons[previous].focus();



            buttons[previous].scrollIntoView({

                behavior: "smooth",

                block: "nearest"

            });



            return;

        }



        /* =================================================
           GIÙ
           ================================================= */

        if (
            event.key === "ArrowDown"
        ) {

            event.preventDefault();



            let next;



            if (index < 0) {

                next = 0;

            }
            else {

                next =
                    index + 1;

            }



            if (
                next >= buttons.length
            ) {

                next = 0;

            }



            buttons[next].focus();



            buttons[next].scrollIntoView({

                behavior: "smooth",

                block: "nearest"

            });



            return;

        }



        /* =================================================
           ENTER / OK
           ================================================= */

        if (
            event.key === "Enter" ||
            event.key === " "
        ) {

            if (
                index >= 0
            ) {

                event.preventDefault();



                if (
                    currentMode === "events"
                ) {

                    playEventChannel(
                        index
                    );

                }
                else {

                    play247Channel(
                        index
                    );

                }

            }

        }

    }
);
