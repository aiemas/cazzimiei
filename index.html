<style>

/* =========================================================
   BASE
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #000;

    color: white;

    font-family: Arial, sans-serif;

    overflow: hidden;

}


/* =========================================================
   PLAYER
   ========================================================= */

#playerContainer {

    position: fixed;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    background: #000;

    z-index: 1;

}


#player {

    width: 100%;
    height: 100%;

    border: 0;

    background: #000;

}


/* =========================================================
   SIDEBAR
   ========================================================= */

#sidebar {

    position: fixed;

    left: 0;
    top: 0;

    width: 400px;
    height: 100vh;

    background: rgba(15, 23, 42, 0.45);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    padding: 15px;

    overflow-y: auto;

    z-index: 1000;

    transform: translateX(0);

    transition: transform 0.35s ease;

    box-shadow: 5px 0 20px rgba(0,0,0,0.5);

}


/* Sidebar nascosta */

#sidebar.hidden {

    transform: translateX(-100%);

}


/* =========================================================
   TITOLO
   ========================================================= */

#sidebar h1 {

    margin: 5px 0 20px 0;

    text-align: center;

    font-size: 22px;

}

#searchBox {

    width: 100%;

    padding: 12px;

    margin-bottom: 15px;

    background: #1f2937;

    border: 2px solid #374151;

    border-radius: 8px;

    color: white;

    font-size: 16px;

    outline: none;

}

#searchBox:focus {

    border-color: white;

    background: #374151;

}

#searchBox::placeholder {

    color: #9ca3af;

}


/* =========================================================
   EVENTO
   ========================================================= */

.event {

    margin-bottom: 18px;

}


.eventTitle {

    padding: 10px;

    margin-bottom: 6px;

    background: #111827;

    border-radius: 6px;

    font-size: 15px;

    font-weight: bold;

    line-height: 1.3;

}


.eventTime {

    color: #22c55e;

    margin-right: 6px;

}


/* =========================================================
   CANALI
   ========================================================= */

.channel {

    width: 100%;

    display: block;

    margin-bottom: 7px;

    padding: 12px 10px;

    background: #1f2937;

    border: 2px solid transparent;

    border-radius: 8px;

    color: white;

    font-size: 15px;

    cursor: pointer;

    text-align: left;

}


.channel:hover {

    background: #374151;

}


.channel:focus {

    outline: none;

    border-color: white;

    background: #16a34a;

}


.channel.active {

    background: #16a34a;

    border-color: white;

}


/* =========================================================
   MESSAGGIO
   ========================================================= */

.message {

    text-align: center;

    color: #9ca3af;

    padding: 20px;

    font-size: 14px;

}


/* =========================================================
   NOME CANALE
   ========================================================= */

#topBar {

    position: fixed;

    top: 15px;
    left: 400px;

    z-index: 900;

    background: rgba(0,0,0,0.65);

    padding: 8px 15px;

    border-radius: 6px;

    font-size: 18px;

    font-weight: bold;

    transition: opacity 0.3s ease;

}


#topBar.hidden {

    opacity: 0;

}


/* =========================================================
   ZONA INVISIBILE PER RIAPRIRE IL MENU
   ========================================================= */

#leftTrigger {

    position: fixed;

    left: 0;
    top: 0;

    width: 25px;
    height: 100vh;

    z-index: 800;

}


/* =========================================================
   BOTTONE CHIUDI
   ========================================================= */

#closeMenu {

    position: absolute;

    top: 10px;
    right: 10px;

    background: #374151;

    border: none;

    color: white;

    width: 35px;
    height: 35px;

    border-radius: 50%;

    cursor: pointer;

    font-size: 18px;

}


/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (max-width: 700px) {

    #sidebar {
        width: 320px;
    }

    #topBar {
        left: 340px;
    }

}

</style>

</head>

/* =========================================================
   CANALI
   ========================================================= */

const channels = [];


/* =========================================================
   ELEMENTI
   ========================================================= */

const channelList =
    document.getElementById("channelList");
const searchBox =
    document.getElementById("searchBox");


const player =
    document.getElementById("player");


const currentChannel =
    document.getElementById("currentChannel");


const sidebar =
    document.getElementById("sidebar");


const topBar =
    document.getElementById("topBar");


/* =========================================================
   CREA LISTA EVENTI E CANALI
   ========================================================= */

let globalIndex = 0;


events.forEach(function(event) {


    /* =====================================================
       CONTENITORE EVENTO
       ===================================================== */

    const eventContainer =
        document.createElement("div");


    eventContainer.className =
        "event";


    /* =====================================================
       TITOLO EVENTO
       ===================================================== */

    const eventTitle =
        document.createElement("div");


    eventTitle.className =
        "eventTitle";


    eventTitle.innerHTML =
        '<span class="eventTime">' +
        escapeHtml(event.time) +
        '</span>' +
        escapeHtml(event.title);


    eventContainer.appendChild(
        eventTitle
    );


    /* =====================================================
       CANALI
       ===================================================== */

    event.channels.forEach(
        function(channel) {


            /* =============================================
               SALVA CANALE
               ============================================= */

            const channelIndex =
                globalIndex;


            channels.push({

                name: channel.name,

                id: channel.id,

                url: channel.url,

                eventTitle: event.title,

                eventTime: event.time

            });


            /* =============================================
               CREA PULSANTE
               ============================================= */

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "channel";


            button.textContent =
                "▶ " + channel.name;


            button.setAttribute(
                "tabindex",
                channelIndex + 1
            );


            button.onclick =
                function() {

                    playChannel(
                        channelIndex
                    );

                };


            eventContainer.appendChild(
                button
            );


            globalIndex++;

        }
    );


    /* =====================================================
       AGGIUNGI EVENTO ALLA SIDEBAR
       ===================================================== */

    channelList.appendChild(
        eventContainer
    );

});

searchBox.addEventListener(
    "input",
    function() {

        const search =
            searchBox.value
                .toLowerCase()
                .trim();

        const eventsContainers =
            document.querySelectorAll(".event");

        eventsContainers.forEach(
            function(container) {

                const text =
                    container.textContent
                        .toLowerCase();

                if (
                    text.includes(search)
                ) {

                    container.style.display =
                        "";

                }
                else {

                    container.style.display =
                        "none";

                }

            }
        );

    }
);


/* =========================================================
   TIMER
   ========================================================= */


/* =========================================================
   INDICE CORRENTE
   ========================================================= */

let currentIndex = 0;


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(text) {

    const div =
        document.createElement("div");


    div.textContent =
        text;


    return div.innerHTML;

}


/* =========================================================
   RIPRODUCI CANALE
   ========================================================= */

function playChannel(index) {


    if (
        index < 0 ||
        index >= channels.length
    ) {

        return;

    }


    currentIndex =
        index;


    /* =====================================================
       CAMBIA STREAM
       ===================================================== */

    player.src =
        channels[index].url;


    /* =====================================================
       CAMBIA NOME
       ===================================================== */

    currentChannel.textContent =
        channels[index].name;


    /* =====================================================
       AGGIORNA SELEZIONE
       ===================================================== */

    const buttons =
        document.querySelectorAll(
            ".channel"
        );


    buttons.forEach(
        function(button) {

            button.classList.remove(
                "active"
            );

        }
    );


    if (buttons[index]) {

        buttons[index].classList.add(
            "active"
        );

    }


    /* =====================================================
       SCROLL
       ===================================================== */

    if (buttons[index]) {

        buttons[index].scrollIntoView({

            behavior: "smooth",

            block: "center"

        });

    }


    /* =====================================================
       MOSTRA SIDEBAR
       ===================================================== */

    showSidebar();

}


/* =========================================================
   MOSTRA SIDEBAR
   ========================================================= */

function showSidebar() {

    sidebar.classList.remove(
        "hidden"
    );

    topBar.classList.remove(
        "hidden"
    );

}


/* =========================================================
   NASCONDE SIDEBAR
   ========================================================= */

function hideSidebar() {


    clearTimeout(
        hideTimer
    );


    sidebar.classList.add(
        "hidden"
    );


    topBar.classList.add(
        "hidden"
    );

}


/* =========================================================
   RESET TIMER
   ========================================================= */


/* =========================================================
   MOUSE SULLA SIDEBAR
   ========================================================= */

sidebar.addEventListener(
    "mousemove",
    function() {

        if (
            !sidebar.classList.contains(
                "hidden"
            )
        ) {

            resetHideTimer();

        }

    }
);


/* =========================================================
   SCROLL
   ========================================================= */

sidebar.addEventListener(
    "wheel",
    function() {

        showSidebar();

    }
);


/* =========================================================
   TOUCH
   ========================================================= */

sidebar.addEventListener(
    "touchstart",
    function() {

        showSidebar();

    }
);


sidebar.addEventListener(
    "touchmove",
    function() {

        showSidebar();

    }
);


/* =========================================================
   ZONA SINISTRA
   ========================================================= */

document
    .getElementById("leftTrigger")
    .addEventListener(
        "mouseenter",
        function() {

            showSidebar();

        }
    );


document
    .getElementById("leftTrigger")
    .addEventListener(
        "mousemove",
        function() {

            showSidebar();

        }
    );


/* =========================================================
   TELECOMANDO / TASTIERA
   ========================================================= */

document.addEventListener(
    "keydown",
    function(event) {


        const buttons =
            Array.from(
                document.querySelectorAll(
                    ".channel"
                )
            );


        if (
            buttons.length === 0
        ) {

            return;

        }


        const current =
            document.activeElement;


        const index =
            buttons.indexOf(
                current
            );


        /* =================================================
           ATTIVITÀ
           ================================================= */

        if (

            event.key === "ArrowLeft" ||

            event.key === "ArrowRight" ||

            event.key === "ArrowUp" ||

            event.key === "ArrowDown" ||

            event.key === "Enter" ||

            event.key === " "

        ) {

            showSidebar();

        }


        /* =================================================
           SINISTRA
           ================================================= */

        if (
            event.key === "ArrowLeft"
        ) {

            event.preventDefault();


            if (index < 0) {

                buttons[currentIndex].focus();

            }
            else {

                buttons[index].focus();

            }


            return;

        }


        /* =================================================
           DESTRA
           ================================================= */

        if (
            event.key === "ArrowRight"
        ) {

            event.preventDefault();


            hideSidebar();


            return;

        }


        /* =================================================
           GIÙ
           ================================================= */

        if (
            event.key === "ArrowDown"
        ) {

            event.preventDefault();


            let next;


            if (index < 0) {

                next =
                    currentIndex + 1;

            }
            else {

                next =
                    index + 1;

            }


            if (
                next >= buttons.length
            ) {

                next = 0;

            }


            currentIndex =
                next;


            buttons[next].focus();


            buttons[next].scrollIntoView({

                behavior: "smooth",

                block: "nearest"

            });


            return;

        }


        /* =================================================
           SU
           ================================================= */

        if (
            event.key === "ArrowUp"
        ) {

            event.preventDefault();


            let previous;


            if (index < 0) {

                previous =
                    currentIndex - 1;

            }
            else {

                previous =
                    index - 1;

            }


            if (
                previous < 0
            ) {

                previous =
                    buttons.length - 1;

            }


            currentIndex =
                previous;


            buttons[previous].focus();


            buttons[previous].scrollIntoView({

                behavior: "smooth",

                block: "nearest"

            });


            return;

        }


        /* =================================================
           ENTER / OK
           ================================================= */

        if (

            event.key === "Enter" ||

            event.key === " "

        ) {


            if (
                index >= 0
            ) {

                event.preventDefault();


                playChannel(
                    index
                );

            }

        }

    }
);


/* =========================================================
   AVVIO
   ========================================================= */

window.addEventListener(
    "load",
    function() {


        console.log(
            "Eventi caricati:",
            events.length
        );


        console.log(
            "Canali caricati:",
            channels.length
        );


        /* =================================================
           METTE IL PRIMO CANALE A FUOCO
           ================================================= */

        const buttons =
            document.querySelectorAll(
                ".channel"
            );


        if (buttons.length > 0) {

            currentIndex = 0;


            buttons[0].focus();


            buttons[0].scrollIntoView({

                behavior: "instant",

                block: "center"

            });

        }

    }
);


</script>
