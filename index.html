<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>TV Player</title>



<style>

/* =========================================================
   BASE
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #000;

    color: white;

    font-family: Arial, sans-serif;

    overflow: hidden;

}



/* =========================================================
   PLAYER
   ========================================================= */

#playerContainer {

    position: fixed;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    background: #000;

    z-index: 1;

}



#player {

    width: 100%;
    height: 100%;

    border: 0;

    background: #000;

}



/* =========================================================
   SIDEBAR
   ========================================================= */

#sidebar {

    position: fixed;

    left: 0;
    top: 0;

    width: 380px;
    height: 100vh;

    background: rgba(15, 23, 42, 0.40);

    padding: 15px;

    overflow-y: auto;

    z-index: 1000;

    transform: translateX(0);

    transition: transform 0.35s ease;

    box-shadow: 5px 0 20px rgba(0,0,0,0.5);

}


/* =========================================================
   SIDEBAR NASCOSTA
   ========================================================= */

#sidebar.hidden {

    transform: translateX(-100%);

}



/* =========================================================
   TITOLO
   ========================================================= */

#sidebar h1 {

    margin: 5px 0 15px 0;

    text-align: center;

    font-size: 22px;

}



/* =========================================================
   NAVIGAZIONE EVENTI / CANALI
   ========================================================= */

#menuTabs {

    display: flex;

    width: 100%;

    gap: 6px;

    margin-bottom: 12px;

}



.menuTab {

    flex: 1;

    padding: 12px 8px;

    background: rgba(255, 255, 255, 0.04);

    border: 2px solid transparent;

    border-radius: 10px;

    color: #94a3b8;

    font-size: 14px;

    font-weight: bold;

    cursor: pointer;

    /* Transizione fluida e cinematografica */
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);

}

/* Scheda attualmente attiva/selezionata */
.menuTab.active {

    background: rgba(255, 255, 255, 0.15);

    border-color: rgba(255, 255, 255, 0.4);

    color: #ffffff;

}

/* Quando passi sopra con il telecomando o il mouse (Glow cinematografico) */
.menuTab:focus,
.menuTab:hover {

    outline: none;

    background: #ffffff;

    color: #000000;

    border-color: #ffffff;

    /* Effetto zoom leggero e bagliore soffuso */
    transform: scale(1.03);

    box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);

}




/* =========================================================
   RICERCA
   ========================================================= */

#searchBox {

    width: 100%;

    padding: 12px;

    margin-bottom: 15px;

    background: rgba(31, 41, 55, 0.35);

    border: 2px solid #374151;

    border-radius: 8px;

    color: white;

    font-size: 16px;

    outline: none;

}



#searchBox:focus {

    border-color: white;

    background: #374151;

}



#searchBox::placeholder {

    color: #9ca3af;

}



/* =========================================================
   EVENTO
   ========================================================= */

.event {

    margin-bottom: 18px;

}



.eventTitle {

    padding: 10px;

    margin-bottom: 6px;

    background: #111827;

    border-radius: 6px;

    font-size: 15px;

    font-weight: bold;

    line-height: 1.3;

}

.eventTitle:focus,
.eventTitle:hover {

    outline: none;

    background: #ffffff !important;

    color: #000000 !important;

    transform: scale(1.02);

    box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);

}



.eventTime {

    color: #22c55e;

    margin-right: 6px;

}



/* =========================================================
   STILE CINEMATOGRAFICO CANALI (EVENTI E 24/7)
   ========================================================= */

.channel, 
.channel247 {


    width: 100%;

    display: block;

    margin-bottom: 8px;

    padding: 14px 16px;

    background: rgba(255, 255, 255, 0.04);

    border: 2px solid transparent;

    border-radius: 10px;

    color: #e2e8f0;

    font-size: 15px;

    font-weight: 500;

    cursor: pointer;

    text-align: left;

    /* Transizione fluida per l'effetto illuminazione */
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);

    position: relative;

    overflow: hidden;

}

.channel { display: none; }

/* Canale attualmente in riproduzione (Active) */
.channel.active, 
.channel247.active {

    background: rgba(255, 255, 255, 0.1);

    border-color: rgba(255, 255, 255, 0.3);

    color: #ffffff;

}

/* Indicatore laterale per il canale attivo */
.channel.active::before,
.channel247.active::before {

    content: "";

    position: absolute;

    left: 0;
    top: 25%;

    width: 4px;
    height: 50%;

    background: #ffffff;

    border-radius: 0 4px 4px 0;

}

/* Selezione con telecomando o Mouse Hover (Glow cinematografico) */
.channel:focus, 
.channel247:focus,
.channel:hover,
.channel247:hover {

    outline: none;

    background: #ffffff;

    color: #000000;

    border-color: #ffffff;

    /* Effetto zoom leggero per dare profondità */
    transform: scale(1.02);

    /* Bagliore d'ombra soffuso (Glow) */
    box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);

    font-weight: bold;

}



/* =========================================================
   CONTENITORI LISTE
   ========================================================= */

#eventList,
#channel247List {

    width: 100%;

}



.hiddenList {

    display: none;

}



/* =========================================================
   MESSAGGIO
   ========================================================= */

.message {

    text-align: center;

    color: #9ca3af;

    padding: 20px;

    font-size: 14px;

}



/* =========================================================
   NOME CANALE
   ========================================================= */

#topBar {

    position: fixed;

    top: 15px;
    left: 400px;

    z-index: 900;

    background: rgba(0,0,0,0.65);

    padding: 8px 15px;

    border-radius: 6px;

    font-size: 18px;

    font-weight: bold;

    transition: opacity 0.3s ease;

}



#topBar.hidden {

    opacity: 0;

}



/* =========================================================
   ZONA INVISIBILE PER RIAPRIRE IL MENU
   ========================================================= */

#leftTrigger {

    position: fixed;

    left: 0;
    top: 0;

    width: 25px;
    height: 100vh;

    z-index: 800;

}



/* =========================================================
   BOTTONE CHIUDI
   ========================================================= */

#closeMenu {

    position: absolute;

    top: 10px;
    right: 10px;

    background: #374151;

    border: none;

    color: white;

    width: 35px;
    height: 35px;

    border-radius: 50%;

    cursor: pointer;

    font-size: 18px;

}



/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (max-width: 700px) {

    #sidebar {

        width: 320px;

    }

    #topBar {

        left: 340px;

    }

}

</style>

</head>

<!-- =========================================================
     PLAYER
     ========================================================= -->

<div id="playerContainer">

    <iframe
        id="player"
        src="about:blank"
        allow="autoplay; fullscreen; picture-in-picture"
        allowfullscreen>
    </iframe>

</div>



<!-- =========================================================
     SIDEBAR
     ========================================================= -->

<div id="sidebar">

    <button
        id="closeMenu"
        onclick="hideSidebar()">

        ×

    </button>



    <h1 id="sidebarTitle">📺 EVENTI</h1>



    <!-- =====================================================
         MENU EVENTI / CANALI
         ===================================================== -->

    <div id="menuTabs">

        <button
            id="eventsTab"
            class="menuTab active"
            tabindex="1"
            onclick="showEvents()">

            📅 EVENTI

        </button>



        <button
            id="channelsTab"
            class="menuTab"
            tabindex="2"
            onclick="showChannels()">

            📺 CANALI

        </button>

    </div>



    <!-- =====================================================
         RICERCA
         ===================================================== -->

    <input
        type="text"
        id="searchBox"
        placeholder="🔎 Cerca evento o canale..."
        autocomplete="off">



    <!-- =====================================================
         LISTA EVENTI
         ===================================================== -->

    <div id="eventList"></div>



    <!-- =====================================================
         LISTA CANALI 24/7
         ===================================================== -->

    <div
        id="channel247List"
        class="hiddenList">
    </div>

</div>



<!-- =========================================================
     NOME CANALE
     ========================================================= -->

<div id="topBar">

    <span id="currentChannel">
        Nessun canale
    </span>

</div>



<!-- =========================================================

<div id="leftTrigger"></div>

   ========================================================= */

/* =========================================================
   CREA LISTA EVENTI
   ========================================================= */

let globalIndex = 0;

events.forEach(function(event) {

    const eventContainer =
        document.createElement("div");

    eventContainer.className =
        "event";

    /* =====================================================
       TITOLO EVENTO (Cliccabile per espandere/comprimere)
       ===================================================== */
    const eventTitle =
        document.createElement("div");

    eventTitle.className =
        "eventTitle";

    // Rende il titolo selezionabile tramite telecomando/tastiera
    eventTitle.setAttribute("tabindex", "0");
    eventTitle.style.cursor = "pointer";

    eventTitle.innerHTML =
        '<span class="eventTime">' +
        escapeHtml(event.time) +
        '</span>' +
        escapeHtml(event.title) +
        ' <span class="arrow-indicator" style="float: right;">▼</span>';

    eventContainer.appendChild(
        eventTitle
    );

    // Array per memorizzare i bottoni dei canali di QUESTO specifico evento
    const eventButtons = [];

    /* =====================================================
       CANALI EVENTO
       ===================================================== */
    event.channels.forEach(
        function(channel) {

            const channelIndex =
                globalIndex;

            channels.push({
                name: channel.name,
                id: channel.id,
                url: channel.url,
                eventTitle: event.title,
                eventTime: event.time
            });

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "channel";

            button.textContent =
                "▶ " + channel.name;

            button.setAttribute(
                "tabindex",
                "0"
            );

            button.onclick =
                function() {
                    playEventChannel(
                        channelIndex
                    );
                };

            eventContainer.appendChild(
                button
            );

            // Salviamo il bottone nell'elenco locale di questo evento
            eventButtons.push(button);
            globalIndex++;

        }
    );

                // FUNZIONE INTERNA PER MOSTRARE/NASCONDERE I CANALI DI QUESTO EVENTO
    function toggleEvent() {
        const isCurrentlyHidden = eventButtons.length > 0 && (eventButtons[0].style.display === "" || eventButtons[0].style.display === "none");
        const indicator = eventTitle.querySelector(".arrow-indicator");

        eventButtons.forEach(function(button) {
            button.style.display = isCurrentlyHidden ? "block" : "none";
        });

        if (indicator) {
            indicator.textContent = isCurrentlyHidden ? "▲" : "▼";
        }

        // AGGIUNTA SBLOCCO TELECOMANDO FIRESTICK:
        // Forza il telecomando ad aggiornare la mappa dei pulsanti visibili
        // per sincronizzare all'istante l'indice di navigazione (currentIndex)
    }




    // =====================================================
// CLICK DEL MOUSE SUL TITOLO EVENTO
// =====================================================

eventTitle.onclick = function() {

    toggleEvent();

};

    eventList.appendChild(
        eventContainer
    );

});

function escapeHtml(text) {

    const div =
        document.createElement("div");



    div.textContent =
        text;



    return div.innerHTML;

}

/* =========================================================
   RIPRODUCI CANALE EVENTO
   ========================================================= */

function playEventChannel(index) {

    if (
        index < 0 ||
        index >= channels.length
    ) {

        return;

    }

    // Salva l'indice del canale evento
    currentEventIndex = index;

    // Manteniamo currentIndex sincronizzato
    // per la modalità eventi
    currentIndex = index;

    player.src =
        channels[index].url;

    currentChannel.textContent =
        channels[index].name;

    const buttons =
        document.querySelectorAll(
            "#eventList .channel"
        );

    buttons.forEach(
        function(button) {

            button.classList.remove(
                "active"
            );

        }
    );

    if (buttons[index]) {

        buttons[index].classList.add(
            "active"
        );

        buttons[index].scrollIntoView({

            behavior: "smooth",

            block: "center"

        });

    }

    hideSidebar();

}



/* =========================================================
   RIPRODUCI CANALE 24/7
   ========================================================= */

function play247Channel(index) {

    if (
        index < 0 ||
        index >= channels247.length
    ) {

        return;

    }

    // Salva separatamente l'indice dei canali 24/7
    current247Index = index;

    // currentIndex viene usato dalla modalità corrente
    currentIndex = index;

    player.src =
        channels247[index].url;

    currentChannel.textContent =
        channels247[index].name;

    const buttons =
        document.querySelectorAll(
            "#channel247List .channel247"
        );

    buttons.forEach(
        function(button) {

            button.classList.remove(
                "active"
            );

        }
    );

    if (buttons[index]) {

        buttons[index].classList.add(
            "active"
        );

        buttons[index].scrollIntoView({

            behavior: "smooth",

            block: "center"

        });

    }

    hideSidebar();

}



/* =========================================================
   MOSTRA SIDEBAR
   ========================================================= */

function showSidebar() {

    sidebar.classList.remove(
        "hidden"
    );

    topBar.classList.remove(
        "hidden"
    );

    setTimeout(function() {

        // MODIFICA QUESTO BLOCCO:
        let buttons;
        if (currentMode === "events") {
            buttons = document.querySelectorAll("#eventList .channel");
        } else {
            buttons = document.querySelectorAll("#channel247List .channel247");
        }

        if (buttons && buttons[currentIndex]) {

            buttons[currentIndex].focus();

            buttons[currentIndex].scrollIntoView({
                behavior: "instant",
                block: "center"
            });

        }

    }, 50);

}




/* =========================================================
   NASCONDE SIDEBAR
   ========================================================= */

function hideSidebar() {

    sidebar.classList.add(
        "hidden"
    );

    topBar.classList.add(
        "hidden"
    );

}

/* =========================================================
   TELECOMANDO / TASTIERA
   ========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        /* =================================================
           SIDEBAR NASCOSTA

           QUALSIASI TASTO RIAPRE IL MENU
           ================================================= */

        if (
            sidebar.classList.contains(
                "hidden"
            )
        ) {

            showSidebar();



            if (
                currentMode === "events"
            ) {

                const buttons =
                    Array.from(
                        document.querySelectorAll(
                            "#eventList .channel"
                        )
                    );



                if (
                    buttons[currentIndex]
                ) {

                    buttons[currentIndex].focus();

                    buttons[currentIndex].scrollIntoView({

                        behavior: "instant",

                        block: "center"

                    });

                }

            }
            else {

                const buttons =
                    Array.from(
                        document.querySelectorAll(
                            "#channel247List .channel247"
                        )
                    );



                if (buttons.length > 0) {

                    buttons[0].focus();

                    buttons[0].scrollIntoView({

                        behavior: "instant",

                        block: "center"

                    });

                }

            }



            return;

        }



        /* =================================================
           TAB ATTIVI
           ================================================= */

        if (
            document.activeElement === eventsTab ||
            document.activeElement === channelsTab
        ) {

            if (
                event.key === "ArrowLeft"
            ) {

                event.preventDefault();

                eventsTab.focus();

                return;

            }



            if (
                event.key === "ArrowRight"
            ) {

                event.preventDefault();

                channelsTab.focus();

                return;

            }



                        if (
                event.key === "ArrowDown"
            ) {

                event.preventDefault();

                if (
                    currentMode === "events"
                ) {
                    // CORRETTO: Scende sul primo TITOLO dell'evento (visto che i canali sono chiusi)
                    const firstTitle = document.querySelector("#eventList .eventTitle");
                    if (firstTitle) {
                        firstTitle.focus();
                        currentIndex = 0;
                    }

                }
                else {

                    const buttons =
                        document.querySelectorAll(
                            "#channel247List .channel247"
                        );

                    if (buttons.length > 0) {

                        buttons[0].focus();
                        currentIndex = 0;

                    }

                }

                return;

            }


        }



        /* =================================================
           CANALE ATTIVO
           ================================================= */

        let buttons;



                if (
            currentMode === "events"
        ) {

            // Prende sia i titoli che i canali, ma filtra tenendo solo i canali visibili
            buttons = Array.from(
                document.querySelectorAll(
                    "#eventList .eventTitle, #eventList .channel"
                )
            ).filter(function(el) {
                if (el.classList.contains("channel")) {
                    return el.style.display === "block";
                }
                return true;
            });

        }

        else {

            buttons =
                Array.from(
                    document.querySelectorAll(
                        "#channel247List .channel247"
                    )
                );

        }



        if (
            buttons.length === 0
        ) {

            return;

        }



        const current =
            document.activeElement;



        const index =
            buttons.indexOf(
                current
            );



        /* =================================================
           SINISTRA
           ================================================= */

        if (
            event.key === "ArrowLeft"
        ) {

            event.preventDefault();

            hideSidebar();

            return;

        }



        /* =================================================
           DESTRA
           ================================================= */

        if (
            event.key === "ArrowRight"
        ) {

            event.preventDefault();

            hideSidebar();

            return;

        }



                /* =================================================
           SU (GESTIONE RISALITA SUI TAB SE SI È SUL PRIMO CANALE)
           ================================================= */

        if (
            event.key === "ArrowUp"
        ) {

            event.preventDefault();

            // Se l'utente si trova sul primo canale della lista, sale sulla scheda attiva
            if (index === 0) {
                if (currentMode === "events") {
                    eventsTab.focus();
                } else {
                    channelsTab.focus();
                }
                return;
            }

            let previous;

            if (index < 0) {

                previous =
                    buttons.length - 1;

            }
            else {

                previous =
                    index - 1;

            }

            if (
                previous < 0
            ) {

                previous =
                    buttons.length - 1;

            }

            buttons[previous].focus();

            buttons[previous].scrollIntoView({

                behavior: "smooth",

                block: "nearest"

            });

            return;

        }

        /* =================================================
           GIÙ (SCORRIMENTO FLUIDO DELLA LISTA CANALI)
           ================================================= */

        if (
            event.key === "ArrowDown"
        ) {

            event.preventDefault();

            let next;

            if (index < 0) {

                next = 0;

            }
            else {

                next =
                    index + 1;

            }

            if (
                next >= buttons.length
            ) {

                next = 0;

            }

            buttons[next].focus();

            buttons[next].scrollIntoView({

                behavior: "smooth",

                block: "nearest"

            });

            return;

        }



                /* =================================================
           ENTER / OK (GESTIONE SELEZIONE TITOLO O CANALE)
           ================================================= */

        if (
    event.key === "Enter" ||
    event.key === " "
) {

    if (
        index >= 0
    ) {

        event.preventDefault();

        const targetElement =
            buttons[index];

        // ==========================================
        // EVENTI
        // ==========================================

        if (
            currentMode === "events"
        ) {

            // --------------------------------------
            // È UN TITOLO EVENTO
            // --------------------------------------

            if (
                targetElement.classList.contains(
                    "eventTitle"
                )
            ) {

                targetElement.click();

                return;

            }

            // --------------------------------------
            // È UN CANALE EVENTO
            // --------------------------------------

            if (
                targetElement.classList.contains(
                    "channel"
                )
            ) {

                const allChannels =
                    Array.from(
                        document.querySelectorAll(
                            "#eventList .channel"
                        )
                    );

                const channelIndex =
                    allChannels.indexOf(
                        targetElement
                    );

                if (
                    channelIndex >= 0
                ) {

                    playEventChannel(
                        channelIndex
                    );

                }

                return;

            }

        }

        // ==========================================
        // CANALI 24/7
        // ==========================================

        else {

            play247Channel(
                index
            );

        }

    }

}
    }
);
