<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I miei Link</title>
    <style>
        /* Sfondo moderno con sfumatura sfumata e scura */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background: linear-gradient(-45deg, #141e30, #243b55, #0f2027);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #ffffff;
            padding: 50px 20px;
            margin: 0;
            min-height: 100vh;
        }

        /* Animazione per rendere lo sfondo dinamico */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        h1 {
            color: #ffffff;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        p {
            color: #b0c4de;
            font-size: 1.1rem;
            margin-bottom: 40px;
        }

        /* Contenitore per allineare i bottoni uno accanto all'altro */
        .contenitore-bottoni {
            display: flex;
            flex-wrap: wrap;       /* Fa andare a capo i bottoni se non c'è spazio */
            justify-content: center; /* Centra i bottoni nello schermo */
            gap: 15px;             /* Spazio tra un bottone e l'altro */
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Stile dei bottoni aggiornato */
        .bottone {
            display: inline-block;
            width: 200px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1); /* Effetto vetro semi-trasparente */
            color: white;
            text-decoration: none;
            font-weight: bold;
            letter-spacing: 1px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px; /* Angoli più arrotondati */
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            backdrop-filter: blur(5px); /* Sfocatura posteriore effetto iOS */
        }

        /* Effetto quando si passa sopra con il mouse o con il focus del telecomando */
        .bottone:hover, .bottone:focus {
            background: #007bff; /* Si illumina di blu */
            border-color: #007bff;
            transform: translateY(-3px); /* Piccola spinta verso l'alto */
            box-shadow: 0 6px 20px rgba(0, 123, 255, 0.4);
        }
    </style>
</head>
<body>

    <h1>Benvenuto nella mia pagina!</h1>
    <p>Clicca sui pulsanti per visitare i siti:</p>

    <div class="contenitore-bottoni">
        <!-- AGGIORNATO: Rimosso target="_blank" per consentire l'apertura all'interno di GeckoView -->
        <a href="https://topstream.help" class="bottone">TOPSTREAM</a>
        <a href="https://zlive.st" class="bottone">ZLIVE</a>
        <a href="https://streamcorner.st" class="bottone">STReAMCORNER</a>
        <a href="https://dlive.sx" class="bottone">DADDY</a>
        <a href="https://footfytv.pro" class="bottone">FOOTFY</a>
        <a href="https://ppv.tj" class="bottone">PPV</a>
        <a href="https://antsports.tv" class="bottone">ANTSPORTS</a>
        <a href="https://ntv.cx" class="bottone">NTV</a>
        <a href="https://github.io" class="bottone">FILM&SERIE</a>
    </div>

</body>
</html>
