    <style>
        /* Sfondo scuro statico e moderno (senza animazioni pesanti per la GPU) */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background: #101726; /* Colore solido e leggero da renderizzare */
            color: #ffffff;
            padding: 50px 20px;
            margin: 0;
            min-height: 100vh;
        }

        h1 {
            color: #ffffff;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        p {
            color: #b0c4de;
            font-size: 1.1rem;
            margin-bottom: 40px;
        }

        /* Contenitore per allineare i bottoni uno accanto all'altro */
        .contenitore-bottoni {
            display: flex;
            flex-wrap: wrap;       
            justify-content: center; 
            gap: 15px;             
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Stile dei bottoni ottimizzato (rimosso il "backdrop-filter" che rallentava tutto) */
        .bottone {
            display: inline-block;
            width: 200px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.08); /* Semplice colore semi-trasparente, leggerissimo */
            color: white;
            text-decoration: none;
            font-weight: bold;
            letter-spacing: 1px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease; /* Transizioni più veloci */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis; 
        }

        /* Effetto hover/focus ultra-fluido (rimosse le ombre pesanti e sfumate) */
        .bottone:hover, .bottone:focus {
            background: #007bff; 
            border-color: #007bff;
            transform: translateY(-2px); 
            outline: none;
        }
    </style>
</head>
